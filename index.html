<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAM</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
      canvas { display: block; }

      #hud {
        position: fixed; left: 18px; top: 16px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fb4cf; text-shadow: 0 1px 3px rgba(0,0,0,.9);
        pointer-events: none; user-select: none;
      }
      #hud b { color: #e8eef7; font-weight: 600; }
      #objective { color: #e8d7b0; margin-bottom: 6px; font-size: 14px; }

      /* A slow vignette, so the darkness closes in at the edges of the screen
         rather than stopping abruptly at the fog. */
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 52%,
          rgba(0,0,0,0) 34%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.88) 100%);
      }

      #banner {
        position: fixed; inset: 0; display: grid; place-content: center;
        text-align: center; pointer-events: none;
        background: radial-gradient(ellipse at center,
          rgba(20,10,4,.55), rgba(0,0,0,.85));
        font-family: ui-rounded, "Avenir Next", system-ui, sans-serif;
        opacity: 0; transition: opacity 1.1s ease;
      }
      #banner.show { opacity: 1; }
      #banner h1 {
        margin: 0; font-size: clamp(30px, 6vw, 62px); font-weight: 700;
        color: #ffdca6; letter-spacing: .01em;
        text-shadow: 0 0 34px rgba(255,150,60,.55);
      }
      #banner p { margin: 12px 0 0; color: #cbb894; font-size: 17px; }
      #banner small { display: block; margin-top: 26px; color: #7d7460; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="vignette"></div>

    <div id="hud">
      <div id="objective">Find your way back to camp.</div>
      <b>WASD</b> move &nbsp; <b>Shift</b> run &nbsp; <b>Space</b> jump &nbsp; <b>Mouse</b> look<br />
      <span id="stats"></span>
    </div>

    <div id="banner">
      <h1>Sam made it home</h1>
      <p id="banner-time"></p>
      <small>Press R to head back out</small>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
