server {
    # Cloud Run tells the container which port to listen on, and it is 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The .glb models and the JS bundle are the bulk of the download.
    gzip on;
    gzip_types application/javascript application/json model/gltf-binary
               text/css image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames can be cached hard; index.html must not be, or a
    # deploy never reaches anyone who has already visited.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /models/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
